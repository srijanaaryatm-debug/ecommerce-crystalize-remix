version: '3.8'
services:
  client:
    build: ./client
    command: sh -c "npm run dev"
    ports: ['5173:5173']
    volumes: ['./client:/app']
    environment:
      - VITE_AUTH_PROVIDER=fake
  server:
    build: ./server
    command: sh -c "node index.js"
    ports: ['4000:4000']
    volumes: ['./server:/app']
    environment:
      - DATABASE_FILE=/app/dev.sqlite
