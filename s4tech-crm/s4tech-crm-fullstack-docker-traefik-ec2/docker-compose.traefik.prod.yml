version: '3.8'
services:
  traefik:
    image: traefik:v3.0
    command:
      - --providers.docker=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.leresolver.acme.tlschallenge=true
      - --certificatesresolvers.leresolver.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.leresolver.acme.storage=/letsencrypt/acme.json
      - --api.dashboard=true
    ports:
      - '80:80'
      - '443:443'
      - '8080:8080' # Traefik dashboard (optional)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    restart: always
    networks:
      - s4net

  client:
    build: ./client
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.client.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.client.entrypoints=websecure"
      - "traefik.http.routers.client.tls.certresolver=leresolver"
      - "traefik.http.services.client.loadbalancer.server.port=80"
    depends_on:
      - server
    restart: always
    networks:
      - s4net

  server:
    build: ./server
    environment:
      - NODE_ENV=production
      - DATABASE_FILE=/data/dev.sqlite
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.server.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.server.entrypoints=websecure"
      - "traefik.http.routers.server.tls.certresolver=leresolver"
      - "traefik.http.services.server.loadbalancer.server.port=4000"
    volumes:
      - ./server/data:/data
    restart: always
    networks:
      - s4net

volumes:
  traefik_letsencrypt:
    driver: local

networks:
  s4net:
    driver: bridge
